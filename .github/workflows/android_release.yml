name: Automated GitHub Release (Android)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish_release:
    name: Package and Deploy Production Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./mob

    steps:
      - name: Fetch Repository Context
        uses: actions/checkout@v4

      - name: Initialize Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Initialize Flutter Framework Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Execute Package Hydration
        run: flutter pub get

      - name: Compile Production APK
        run: flutter build apk --release

      - name: Generate GitHub Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: OpenSpark Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mob/build/app/outputs/flutter-apk/app-release.apk